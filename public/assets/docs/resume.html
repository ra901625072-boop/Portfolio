<style>
  :root {
    --transition-timing: cubic-bezier(0.16, 1, 0.3, 1);
  }
  
  html, body { 
    margin: 0; 
    padding: 0; 
    background: #000000; 
    min-height: 100%;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  }

  .page-wrap { 
    display: flex; 
    justify-content: center; 
    align-items: flex-start; 
    min-height: 100vh; 
    padding: 24px 16px; 
    box-sizing: border-box; 
  }

  svg { 
    width: 210mm; 
    max-width: 95vw; 
    height: auto; 
    background: #ffffff; 
    border-radius: 4px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85); 
  }
  
  svg a text,
  svg a tspan {
    text-decoration: none !important;
    cursor: pointer;
  }

  svg a:hover text,
  svg a:hover tspan {
    opacity: 0.75;
  }
  
  @media screen {
    body, svg, svg * {
      transition: fill 0.4s var(--transition-timing), 
                  stroke 0.4s var(--transition-timing), 
                  background-color 0.4s var(--transition-timing), 
                  background 0.4s var(--transition-timing), 
                  box-shadow 0.4s var(--transition-timing),
                  border-color 0.4s var(--transition-timing);
    }

    /* === LIGHT MODE: WHITE CARD + BLACK PAGE BACKGROUND === */
    body.light-theme {
      background: #000000 !important;
    }
    body.light-theme svg {
      background: #ffffff !important;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.1) !important;
    }
    body.light-theme svg > rect:first-of-type {
      fill: #ffffff !important;
    }
    body.light-theme svg text[fill="#0284C7" i],
    body.light-theme svg text[fill="#1E40AF" i],
    body.light-theme svg text[fill="#1f4e5f" i] {
      fill: #0284C7 !important;
    }
    body.light-theme svg line[stroke="#0284C7" i],
    body.light-theme svg line[stroke="#1E40AF" i],
    body.light-theme svg line[stroke="#1f4e5f" i] {
      stroke: #0284C7 !important;
      stroke-width: 1.4px !important;
    }
    body.light-theme svg text[fill="#333333"] {
      fill: #1E293B !important;
    }
    body.light-theme svg text[fill="#222222"] {
      fill: #334155 !important;
    }
    body.light-theme svg text[fill="#555555"],
    body.light-theme svg tspan[fill="#555555"] {
      fill: #64748B !important;
    }
    body.light-theme svg tspan[fill="#888888"] {
      fill: #94A3B8 !important;
    }
    body.light-theme svg tspan[fill="#222222"] {
      fill: #334155 !important;
    }
    body.light-theme svg tspan[font-weight="bold"] {
      fill: #0F172A !important;
    }
    /* Black link color without underline */
    body.light-theme svg a text,
    body.light-theme svg a tspan {
      fill: #000000 !important;
      text-decoration: none !important;
      font-weight: 500 !important;
    }
    body.light-theme svg circle {
      fill: #0284C7 !important;
    }
    body.light-theme svg rect[fill="#0284C7" i],
    body.light-theme svg rect[fill="#1E40AF" i],

    }
    body.light-theme svg rect[stroke="#BFBFBF" i] {

    }
    body.light-theme .resume-toolbar {

      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    body.light-theme .toolbar-btn {
      color: #CBD5E1;
    }
    body.light-theme .toolbar-btn:hover {
      background: rgba(2, 132, 199, 0.2);
      color: #38BDF8;
    }
    body.light-theme .toolbar-divider {
      background: rgba(255, 255, 255, 0.2);
    }

    /* === DARK MODE: DARK CARD + WHITE PAGE BACKGROUND (RED ACCENTS) === */
    body.dark-theme {
      background: #F8FAFC !important;

    }
    body.dark-theme svg tspan[fill="#888888"] {
      fill: #475569 !important;
    }
    body.dark-theme svg tspan[fill="#222222"] {
      fill: #CBD5E1 !important;
    }
    body.dark-theme svg tspan[font-weight="bold"] {
      fill: #FFFFFF !important;
    }

    body.dark-theme svg a text,
    body.dark-theme svg a tspan {
      fill: #E12D33 !important;
      text-decoration: none !important;
      font-weight: 500 !important;
    }
    body.dark-theme svg circle {
      fill: #E12D33 !important;
    }
    body.dark-theme svg rect[fill="#0284C7" i],
    body.dark-theme svg rect[fill="#1E40AF" i],
    body.dark-theme svg rect[fill="#1f4e5f" i] {
      fill: #1A0406 !important;
      stroke: #E12D33 !important;
      stroke-width: 1px !important;

    }
    body.dark-theme svg rect[stroke="#BFBFBF" i] {

    body.dark-theme .resume-toolbar {

    body.dark-theme .toolbar-btn {

    }
    body.dark-theme .toolbar-btn:hover {

      color: #E12D33;
    }
    body.dark-theme .toolbar-divider {
      background: rgba(15, 23, 42, 0.15);
    }
  }

  /* === FLOATING TOOLBAR (SHOWN ONLY ON STANDALONE RESUME PAGE) === */
  body.in-iframe .resume-toolbar {
    display: none !important;
  }

  .resume-toolbar {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 1000;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 9999px;
    padding: 5px 8px;
    transition: all 0.3s ease;
  }

  .toolbar-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    border-radius: 50%;
    transition: all 0.2s ease;
    user-select: none;
  }

  .toolbar-btn:hover {
    transform: scale(1.08);
  }

  .toolbar-btn svg {
    width: 18px;
    height: 18px;
    box-shadow: none !important;
    background: transparent !important;
  }

  .toolbar-divider {
    width: 1px;
    height: 18px;
    margin: 0 2px;
  }

  /* Icons toggle */
  .sun-icon { display: none; }
  .moon-icon { display: block; }

  body.light-theme .sun-icon { display: block; }
  body.light-theme .moon-icon { display: none; }

  @media print {
    @page {
      size: A4;
      margin: 0;
    }
    html, body {
      background: #ffffff !important;
      height: auto !important;
    }
    .page-wrap {
      padding: 0 !important;
      margin: 0 !important;
      display: block !important;
    }
    .resume-toolbar {
      display: none !important;
    }
    svg {
      width: 100% !important;
      max-width: 100% !important;
      box-shadow: none !important;
      border: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }
  }
</style>

<script>
  // Hide toolbar if embedded inside portfolio iframe
  const isEmbedded = (window.self !== window.top) || new URLSearchParams(window.location.search).get('embedded') === 'true';
  if (isEmbedded) {
    document.body.classList.add('in-iframe');
    const tb = document.getElementById('resume-toolbar');
    if (tb) tb.style.display = 'none';
  }

  function applyTheme(themeName) {
    if (themeName === 'light') {
      document.body.classList.add("light-theme");
      document.body.classList.remove("dark-theme");
    } else {
      document.body.classList.add("dark-theme");
      document.body.classList.remove("light-theme");
    }
  }

  // Determine initial theme: URL param > localStorage > system preference
  const urlParams = new URLSearchParams(window.location.search);
  const paramTheme = urlParams.get('theme');
  let currentTheme = 'light'; // Default to light-theme (white card with black background)

  if (paramTheme === 'light' || paramTheme === 'dark') {
    currentTheme = paramTheme;
  } else {
    try {
      const saved = localStorage.getItem('portfolio-theme') || localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        currentTheme = saved;
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        currentTheme = 'dark';
      }
    } catch (e) {
      // fallback
    }
  }

  applyTheme(currentTheme);

  // Toggle button handler
  const toggleBtn = document.getElementById("theme-toggle-btn");
  if (toggleBtn) {
    toggleBtn.addEventListener("click", () => {
      const isLight = document.body.classList.contains("light-theme");
      const nextTheme = isLight ? "dark" : "light";
      applyTheme(nextTheme);
      try {
        localStorage.setItem("portfolio-theme", nextTheme);
      } catch (e) {}
    });
  }

  // Listen to postMessage from parent portfolio page if embedded in iframe
  window.addEventListener("message", (event) => {
    if (event.data && typeof event.data === 'object' && event.data.type === 'THEME_CHANGE') {
      applyTheme(event.data.theme);
    }
  });
</script>
